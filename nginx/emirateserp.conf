# Redirect HTTP to HTTPS for all matching subdomains
server {
    listen 80;
    server_name master.emirateserp.com *.emirateserp.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server for ERP application subdomains
server {
    listen 443 ssl;
    server_name master.emirateserp.com *.emirateserp.com;

    # The SSL certificates generated by Certbot
    ssl_certificate     /etc/letsencrypt/live/emirateserp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emirateserp.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    # Reverse proxy for Spring Boot backend API
    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    # Reverse proxy for React frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}
