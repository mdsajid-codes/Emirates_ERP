# Spring JPA
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.ddl-auto=update

# SQL Init
spring.sql.init.mode=never

# Servlet Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mail
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App
app.company.default-email=sales@yourcompany.com

# Database Encryption Config
app.encryption.key=${ENCRYPTION_KEY:GTRServiceKey2026Encryption32Chr}

# Server
server.port=8080

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master-db.xml
spring.liquibase.enabled=false
# Since we have multiple data sources, we might need to specify which one Liquibase uses.
# By default it uses the @Primary DataSource.

