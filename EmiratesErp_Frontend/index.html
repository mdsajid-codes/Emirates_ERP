<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/gtr.png" />
  <link rel="apple-touch-icon" href="/gtr.png" />
  <link rel="shortcut icon" href="/gtr.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTR Services</title>
  <style>
    :root {
      /* Base Defaults - Matches DEFAULT_THEME */
      --color-background: #f1f5f9;
      --color-background-muted: #f8fafc;
      --color-foreground: #0f172a;
      --color-foreground-muted: #64748b;
      --color-primary: #1a237e;
      --color-primary-foreground: #ffffff;
      --color-card: #ffffff;
      --color-card-foreground: #0f172a;
      --color-border: #e2e8f0;
      --color-input: #e2e8f0;
      
      /* New Extended Variables */
      --color-sidebar-bg: #1e293b;
      --color-sidebar-text: #f8fafc;
      --color-sidebar-active: #334155;
      --color-sidebar-hover: #475569;
      
      --color-header-bg: #ffffff;
      --color-header-text: #0f172a;
      
      --color-error: #ef4444;
      --color-success: #22c55e;
      --color-warning: #f59e0b;
      --color-info: #3b82f6;

      --theme-border-radius: 0.5rem;
      --font-family-sans: "Inter", sans-serif;
    }

    /* Keep the .dark block just to invert basic things missing from the CSS variables, 
       but colors will primarily be handled dynamically. */
    .dark {
      color-scheme: dark;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
