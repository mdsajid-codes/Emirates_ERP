name: Deploy Emirates ERP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Build & Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/EmiratesErp

            # Use the Personal Access Token (GH_PAT) to authenticate the git pull
            # This temporarily sets the remote URL to include the token for authentication
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
            
            # Pull latest code
            git pull origin main

            # Revert the remote URL back to normal (without token) for security
            git remote set-url origin https://github.com/${{ github.repository }}.git

            # Write .env from GitHub Secrets
            cat > .env << EOF
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_DATABASE=master_db
            DB_HOST=mysql
            DB_PORT=3306
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            EOF

            # Rebuild and restart containers
            docker compose up -d --build --remove-orphans

            # Clean up old unused images
            docker image prune -f
