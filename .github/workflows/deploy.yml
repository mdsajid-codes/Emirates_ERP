name: Deploy Emirates ERP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/Emirates_ERP

            # Pull latest code using the Deploy Key configured on this server
            git pull origin main

            # Rebuild and restart containers (.env file lives permanently on this server)
            docker compose up -d --build --remove-orphans

            # Clean up old unused images to save disk space
            docker image prune -f
